[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[project]
name = "tikzfy"
version = "0.1.0"
description = "TIkZfy — Multimodal Image-to-TikZ Neural Engine & Geometric Compiler"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Antonio Machuca" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "einops>=0.6.0",
    "aiohttp>=3.8.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "httpx>=0.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0"
]

[tool.mypy]
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
exclude = ["build/", "dist/", ".venv/", "frontend/"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]
exclude = [
    "build",
    "dist",
    ".venv",
    ".git",
    "frontend",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C4", # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "B008", # do not perform function calls in argument defaults (FastAPI File/Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "ports", "adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "infrastructure: requires external OS binaries (TeX Live, Ghostscript)",
]
