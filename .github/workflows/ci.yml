name: Engine CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 matches the Docker image; 3.12 matches the local dev environment
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only wheels: the full CUDA build (~2.5 GB) buys nothing on CPU runners
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt mypy ruff
          pip install -e .

      - name: Ruff
        run: ruff check .

      - name: Mypy (strict)
        run: mypy .

      - name: Pytest
        # Infrastructure-marked tests need TeX Live/Ghostscript; they run locally and in Docker
        run: pytest tests/ -q -m "not infrastructure"

  docker:
    name: Docker Build & Infra Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t image-to-tikz-engine .

      - name: Infrastructure tests
        # TeX Live and Ghostscript only exist inside the image; the
        # infrastructure-marked tests run against the freshly built artifact
        run: docker run --rm image-to-tikz-engine pytest tests/ -q -m infrastructure
